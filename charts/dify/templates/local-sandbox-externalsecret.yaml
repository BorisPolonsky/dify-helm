{{- if and .Values.externalSecret.enabled .Values.externalSecret.localSandbox.enabled .Values.localSandbox.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ template "dify.localSandbox.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dify.labels" . | nindent 4 }}
    app.kubernetes.io/component: local-sandbox
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStore.name }}
    kind: {{ .Values.externalSecret.secretStore.kind }}
  target:
    name: {{ template "dify.localSandbox.fullname" . }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        {{- if .Values.externalSecret.localSandbox.remoteRefs.SHELLCTL_AUTH_TOKEN }}
        SHELLCTL_AUTH_TOKEN: "{{ `{{ .SHELLCTL_AUTH_TOKEN }}` }}"
        {{- end }}
  data:
    {{- if .Values.externalSecret.localSandbox.remoteRefs.SHELLCTL_AUTH_TOKEN }}
    - secretKey: SHELLCTL_AUTH_TOKEN
      remoteRef:
        key: {{ .Values.externalSecret.localSandbox.remoteRefs.SHELLCTL_AUTH_TOKEN.key }}
        {{- if .Values.externalSecret.localSandbox.remoteRefs.SHELLCTL_AUTH_TOKEN.property }}
        property: {{ .Values.externalSecret.localSandbox.remoteRefs.SHELLCTL_AUTH_TOKEN.property }}
        {{- end }}
        {{- if .Values.externalSecret.localSandbox.remoteRefs.SHELLCTL_AUTH_TOKEN.decodingStrategy }}
        decodingStrategy: {{ .Values.externalSecret.localSandbox.remoteRefs.SHELLCTL_AUTH_TOKEN.decodingStrategy }}
        {{- else if .Values.externalSecret.decodingStrategy }}
        decodingStrategy: {{ .Values.externalSecret.decodingStrategy }}
        {{- end }}
        conversionStrategy: Default
        metadataPolicy: None
    {{- end }}
{{- end }}
